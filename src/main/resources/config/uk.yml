# Для запуску Darkness потрібна ліцензія (надається після покупки)
your_license: "null"

alerts:
  # Окрім трансляції сповіщень гравцям, чи повинні вони також надсилатися на консоль?
  print_to_console: true
  # Це контролює, чи будуть/як будуть передаватися сповіщення між серверами, підключеними до вашого проксі.
  # У вас має бути включений 'bungee-plugin-message-channel' у конфігурації Velocity, якщо ви її використовуєте.
  proxy:
    # Чи слід надсилати сповіщення на інші сервери, підключені до вашого проксі-сервера?
    send: false
    # Чи повинні сповіщення, отримані з інших серверів, оголошуватися на цьому сервері?
    receive: false

verbose:
  print_to_console: false

# Чи потрібно увімкнути тестовий-режим?
# Якщо цей режим увімкнено, команди покарання, обертання та перемішування слотів не працюватимуть.
test_mode: false

# Тема, яку використовуватиме Darkness
theme: default

# Client Settings
client_settings:

  # Client Alert Settings
  alert:

    # Чи повинні ми надсилати попередження, коли гравець приєднується, вказуючи його бренд клієнта?
    enabled: true

    # Видаляє наступний регулярний вираз з назви клієнта
    remove: " \\(Velocity\\)$"

    # Це означає, що вона не транслюватиме його бренд операторам, якщо бренд відповідає наступним регулярним виразам
    ignored_clients:
      - "^badlion$"
      - "^optifine$"
      - "^vanilla$"
      - "^quilt$"
      - "^fabric$"
      - "^Feather Fabric$"
      - "(^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}(,fabric)?$)|(^lunarclient:[a-z0-9]{7}/[\\w_/-]{3,32}$)"
      - "^labymod$"

  # Клієнтські бренди, що містять такі назви, будуть заблоковані від входу на сервер
  banned_clients:
    - "^1.12.2$"
    - "^mcp$"
    - "^ForgeOptiFine 1.16.5/forge/modified$"
    - ".*/.*"

  # Мінімальна/Максимальна довжина назви бренду клієнта.
  symbol_limiter: 5:16
  # Блокування використання неприпустимих символів у назві бренду.
  whitelist_regex: "^[a-zA-Z0-9:_/, .-]+$"
  # Чи перевіряти кількість капсу (рекомендовано не вимикати, щоб виявляти підміни типу FORGE, VANILLA) (-1 щоб вимкнути)
  caps_percentage: 70
  # Чи потрібно блокувати чит клієнти за підозрілими ознаками (наприклад Delta Client та інші)
  cheat_detector: true
  # Darkness блокуватиме клієнтів за назвою канала за допомогою регексу.
  # Якщо назва канала співпадає з цим регексом, він не зможе зайти на сервер.
  payload:
    - "Remix"
    - "CRYSTAL"
    - "matrix"
    - "CrystalWare"
    - "Misplace"
    - "reach"
    - "lmaohax"
    - "Reach Mod"
    - "cock"
    - "Vape v3"
    - "1946203560"
    - "#unbanearwax"
    - "EARWAXWASHERE"
    - "Cracked Vape"
    - "EROUAXWASHERE"
    - "moon:exempt"
    - "Vape"
    - "WDL|INIT"
    - "WDL|CONTROL"
    - "Bspkrs Client"

  # Даркнесс вносит у чорний список певні версії Forge, які містять вбудовані чіти на дальність удару (Reach) (Forge 1.18.2 — 1.19.3).
  # Встановлення цього параметра в false дозволить таким клієнтам підключатися до сервера.
  # Виключайте на свій страх і ризик.
  disconnect_blacklisted_forge_versions: true

# Packet Settings
packet_settings:

  # Максимальна кількість пропущених транзакцій, після якої гравця викидає з сервера
  # Спрацьовує при FreeCam, BackTrack, Blink
  transaction_skip: 400
  # Скільки часу гравці мають, перш ніж їх викине через тайм-аут? За замовчуванням = 45 секунд
  transaction_time: 45
  # Максимально допустиме від’ємне зміщення таймера гравця, після якого кикаємо (в мілісекундах)
  # Спрацьовує при Timer (0.1), Freeze
  negative_timer: 5000
  # Кікає за відправку пакетів з неможливою позицією
  invalid_packet_position: true
  # Кікає за відправку невалідних кутів огляду, які створюють ідентичний патерн рухів
  invalid_packet_rotation: true
  # Ця настройка застосовується лише до клієнтів 1.17–1.20.5 на серверах 1.8
  cancel_duplicate_packet: true
  # Ігнорувати ротацію у дублікатних пакетах?
  ignore_duplicate_packet_rotation: true
  # Увімкніть це, щоб заборонити Даркнесс скасовувати пакети pong, отримані від гравців
  # Може покращити сумісність з іншими античитами. Може викликати проблеми з лімітуванням пакетів
  # Не вмикайте, якщо не впевнені у тому, що робите
  disable_pong_cancelling: false
  # Даркнесс іноді скасовує незаконні пакети, наприклад, з таймером, після X скасованих пакетів за секунду
  # Чи слід просто кикати гравця замість цього? Це потрібно, бо деякі лімітери пакетів не враховують пакети, скасовані Даркнесс
  packet_spam_threshold: 100
  # Даркнесс може гарантувати, що гравець, виведений з режиму польоту, не може мати пінг більше X мілісекунд.
  # Це пов'язано з тим, що Даркнесс наразі не перевіряє літаючих гравців.
  max_ping_out_of_flying: 300
  # Максимальний пінг, коли посилення феєрверка знімається з гравця.
  # Це не дозволяє гравцям із високою затримкою використовувати одне посилення феєрверка з надкриллями назавжди.
  max_ping_firework_boost: 1000

## Connection Settings
connection_settings:

  # При значенні true сервер буде затримувати або скасовувати пакети, якщо у гравця почалися лаги.
  force_hold_server_packets: true

  # Затримка відповіді на транзакцію, після якої гравець вважається таким, що лагає.
  enforce_latency_ms: 500

  # Скільки секунд може пройти без пакетів руху, перш ніж Даркнес видасть прапор?
  enforce_flying_second: 4

  # Чи потрібно скасовувати удари, якщо гравець перебуває в стані жорсткого мережевого лагу?
  cancel_hits: true

  # Увімкніть це, щоб блокувати обробку пересування гравця, якщо його затримка вийшла за межі.
  block_movement: true

  # Якщо true, сервер припинить надсилати дані про світ (рух інших сутностей, блоки) гравцеві, який лагає.
  cancel_outbound_packets: false

# Налаштування команд покарання // Не рекомендується до використання — скоро буде видалено
point_command:

  # Команди, які будуть виконуватися за різних умов (наприклад, при порушеннях)
  '1': darkness rotate %PLAYER%
  '2': darkness shuffle %PLAYER% many
  '3': darkness rotate %PLAYER%
  '4': darkness shuffle %PLAYER% many
  '6': darkness kick %PLAYER% &cПідозра у використанні читів
  '7': darkness crash %PLAYER% particle
  '8': darkness kick %PLAYER% &cПідозра у використанні читів
  '9': darkness ban %PLAYER% &cПідозра у використанні читів
  '21': darkness kick %PLAYER% &cПідозра у використанні читів
  '26': darkness kick %PLAYER% &cПідозра у використанні читів
  '30': darkness ban %PLAYER% &cПідозра у використанні читів
  '34': darkness kick %PLAYER% &cПідозра у використанні читів
  '38': darkness ban %PLAYER% &cПідозра у використанні читів

# Punish Command Settings
punish_command:

  # Яку анімацію покарання повинна показувати Даркнесс перед киком гравця?
  # Анімації: NONE, THOR, FIRE, ERROR, SHAME або RANDOM для вибору випадкової анімації кожен раз
  animation: NONE

  # Чи повинні ми надсилати повідомлення в чат, коли гравець карається Даркнесс?
  broadcast: true

  # Яку команду повинна виконати Даркнесс після завершення анімації покарання? (%nl% для нового рядка)
  # Плейсхолдери: %prefix% -> (Префікс Даркнесс), %player% -> (Гравець, який був покараний), %reason% -> (Причина, вказана в команді покарання Даркнесс)
  command: darkness kick %player% %prefix% %reason%

# Punish Wave Settings
punishwave:

  # Чи ввімкнути Хвилю Покарань?
  # Якщо Хвиля Покарань увімкнена, Даркнесс покарає всіх читерів одночасно
  # Якщо гравець був покараний за допомогою команди /darkness punish при ввімкненій Хвилі Покарань,
  # він буде доданий до черги та покараний, коли почнеться Хвиля Покарань
  enabled: false

  # Чи повинна Даркнесс повідомляти про цю подію?
  broadcast: true

  # Як часто повинна виконуватися Хвиля Покарань? (у хвилинах)
  time: 15

  # Зворотний відлік перед виконанням Хвилі Покарань (-1 щоб вимкнути)
  countdown: 5

# Ban Command Settings
ban_command:

  # Чи повинні ми надсилати повідомлення в чат, коли гравець карається Даркнесс?
  broadcast: true

  # Плейсхолдери: %player% -> (Гравець, який був покараний), %reason% -> (Причина, вказана в команді покарання Даркнесс)
  command: ban %player% %reason%

# Discord Sync Settings
discord:

  # Ви хочете синхронізувати Darkness із вашим Discord-сервером?
  enabled: false

  # Вставте URL вебхука каналу
  webhook_url: ""
  # Заголовок повідомлення
  embed_title: "**:fire: ВИЯВЛЕНО НОВОГО ЧИТЕРА!**"
  # Колір смуги зліва від повідомлення
  embed_color: "#ff0000"

  # Зміст повідомлення
  violation_content:
    - "%player%"
    - ""
    - ":shield: **Режим:**"
    - "%server_name%"
    - ""
    - ":package: **Тип чіту:**"
    - "%check%"
    - ""
    - ":bar_chart: **Рівень:**"
    - "%violations%"
    - ""
    - ":desktop: **Клієнт:**"
    - "%brand%"
    - ""
    - ":pushpin: **Версія:**"
    - "%version%"
    - ""
    - ":signal_strength: **PING | TPS:**"
    - "%ping% | %tps%"

  # Бажаєте, щоб Darkness надсилала повідомлення в Discord,
  # коли гравці караються під час Punish Wave?
  punishwave: false
  punishwave_title: "**:fire: ВИЯВЛЕНО ХВИЛЮ НОВИХ ЧИТЕРІВ!**"

  # Зміст повідомлення
  punishwave_content:
    - ":shield: **Режим**"
    - "%server_name%"
    - ""
    - ":busts_in_silhouette: **Покарані гравці**"
    - "%players_punishwave%"
    - ""

  # Заголовок додаткового поля в ембед
  embed_field: "Інформація:"

# Log Settings
logs:

  # Який тип логування використовувати Darkness?
  # Типи: YAML_ONE, YAML_DAYS, MYSQL, SQLITE, NONE
  # 1. YAML_ONE - Логує всі флаги в один файл data.yml
  # 2. YAML_DAYS - Логує кожен день в окремий файл у папці logs
  # 3. SQLITE - Логує в базу даних SQLite
  # 4. MYSQL - Логує в базу даних MySQL
  # 5. NONE - Виключає логування
  type: YAML_ONE

  # Логи, старші за це значення в днях, будуть видалені
  clear_days: 7

  # Налаштування MySQL (потребує тип MYSQL)
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: ''
    use_ssl: false

    # Налаштування пулу з'єднань MySQL
    # Не змінюйте, якщо не знаєте, що робите
    pool_settings:
      maximum_pool_size: 50
      minimum_idle: 30
      maximum_lifetime: 1800000
      connection_timeout: 30000
      leak_detection_threshold: 0

## InformationHider Check
InformationHider:

  # Увімкнути модуль приховування інформації?
  enabled: true

  # Перевіряти тільки гравців чи всіх істот?
  onlyForPlayers: true

  # Приховує дані про гравців та мобів, щоб чити не могли отримати зайву інформацію.
  # Для звичайних гравців нічого не зміниться, але чити не працюватимуть як треба.
  parts:
    # Спуфить здоров’я — гравці та моби завжди показують фейкове здоров'я
    # Корисно проти хп-барів у модах та читах
    health:
      # Вкажіть значення, яке Darkness повинна спуфити для гравців від 0 до 20.
      # Значення 0 зламає багато KillAura хаків, але також порушує анімацію ходьби.
      # Не рекомендовано, якщо не хочете, щоб гравці ходили як "місячною походкою".
      # Встановіть -1, щоб повністю вимкнути цей модуль
      value: 20
      # Якщо увімкнено, буде використовуватися випадкове значення від 0 до 20.
      # Менш помітно для гравців і краще зберігає процес гри.
      random: false

    # Маскує внутрішні дані гравця, щоб модулі читів не могли їх використовувати.
    # Приховує реальний рівень досвіду, щоб запобігти його відображенню в читах.
    xp: true
    # Приховує рівень кисню, щоб чити не показували точну кількість повітря.
    air: true
    # Приховує рівень ситості. Ламає роботу функцій AutoEat у чит-клієнтах.
    saturation: true
    # Приховує золоті серця поглинання від золотих яблук та ефектів.
    absorption: true
    # Приховує реальний пінг у табі. Запобігає деяким обходам у модулях AntiBot.
    ping: true
    # Приховує режим гри. Чити завжди бачитимуть гравця в Creative.
    gamemode: true
    # Надсилає фейковий сид світу, щоб чити не могли знайти руду та структури за сидом.
    seed: true

    # Приховує дані про здоров'я та статистику зі скорбордів та таб-листа.
    # Підміняє реальні показники HP у списку гравців на фейкові.
    scoreboard:
      # Чи потрібно маскувати здоров'я у скорбордах та таб-листі?
      # Якщо InformationHider.parts.health.value встановлено на -1, цей модуль вимкнеться.
      enabled: true
      # Список патернів імен завдань у скорборді, які потрібно перехоплювати.
      # Даркнесс шукає ці ключові слова в назвах завдань, щоб зрозуміти, де відображається HP.
      patterns:
        - "health"
        - "hp"
        - "hearts"
        - "TAB-BelowName"
        - "TAB-Sidebar"
        - "TAB-TabList"

    # Маскує екіпірування та візуальні ефекти персонажів.
    # Приховує зачарування на броні та предметах, щоб чити не бачили їхній тип та рівень.
    enchant: true
    # Приховує точну кількість предметів у руках та інвентарі.
    item_count: true
    # Замінює справжні назви предметів у руках на випадкові.
    item_name: true
    # Приховує назви та кількість предметів, що лежать на землі.
    item_drop: true
    # Завжди показує повну міцність речей, щоб чити не бачили зношення броні.
    durability: true
    # Приховує ефекти зілля від чужих очей (щоб не бачили силу, швидкість тощо).
    potion: true
    # Приховує тип зцілення в руках, другій руці чи стрілах.
    potion_items: true
    # Спамить читу фейковими пакетами ефектів, повністю забиваючи його PotionList сміттям.
    end_effect: true

    # Змінює назву бренду сервера на екрані налагодження (F3) у Minecraft.
    # Корисно для відображення кастомних повідомлень або приховування софту вашого сервера.
    server_brand:
      # Увімкнути підміну бренду сервера?
      enabled: true
      # Назва бренду, яку бачить клієнт під час підключення та на екрані F3
      brand: "Server"

    # Приховує гравців за стінами та блоками на рівні пакетів.
    # Ламає роботу функцій ESP, Tracers та Wallhack у чит-клієнтах.
    #
    # ПРОДУКТИВНІСТЬ:
    # - У закритих просторах (печери, арени) модуль ЗНИЖУЄ навантаження на мережу та сервер,
    #   оскільки перестає надсилати пакети руху прихованих гравців.
    # - При ВЕЛИКІЙ концентрації гравців в одному місці перевірка видимості через блоки
    #   може викликати підвищене навантаження на CPU.
    esp:

      # Чи потрібно приховувати гравців за перешкодами?
      enabled: true
      # Максимальна дистанція (у блоках), на якій перевіряється видимість гравців.
      # Чим менше значення, тим нижче навантаження на сервер.
      max_distance: 48.0
      # Горизонтальний кут огляду (у градусах) для перевірки, чи видно гравця на екрані.
      # Збільште для ультрашироких моніторів; 180 прибирає помилки з боків екрана.
      max_fov: 165.0
      # Дистанція (у блоках) навколо гравця, де всі завжди видимі.
      # Допомагає уникнути затримки промальовування, коли гравець різко вибігає з-за рогу.
      proximity_distance: 3.0
      # Затримка перед приховуванням гравця за стіною (у тіках).
      # Запобігає миготінню моделей на кутах та згладжує пінг.
      hide_delay_ticks: 5
      # Як часто перераховувати видимість гравців (у тіках).
      # Низькі значення знижують продуктивність, високі значення можуть
      # призвести до того, що гравці будуть занадто довго приховані й раптово з'являтимуться.
      interval_ticks: 2
      # Чи потрібно приховувати звуки від прихованих за стіною гравців?
      hide_sounds: false
      # Чи потрібно прибирати підсвічування контурів у гравців за стінами?
      hide_glowing: false
      # Налаштування приховування гравців, пов'язані з ефектами зіль.
      effects:
        # Чи приховувати гравців, коли спостерігач має ефект сліпоти?
        blindness: true
        # Чи приховувати гравців, коли спостерігач має ефект темряви?
        darkness: true
        # Чи приховувати невидимих гравців, якщо у них немає предметів у руках та немає броні?
        # Самі частинки зіль при цьому не приховуються, зберігаючи ванільну механіку виявлення.
        invisible: true
      # Чи прораховувати огляд для режимів камери від 3-го обличчя (F5)?
      # Запобігає зникненню гравців при погляді з-за рогу.
      calculate_third_person_modes: true
      # За замовчуванням ванільні нікнейми видно крізь стіни, якщо гравець не на шифті.
      # Якщо встановити false - приховуватимуться взагалі всі гравці за стінами.
      # Значення true приховує тільки тих, хто на шифті - це економить CPU і не ламає неймтеги.
      only_sneaking: false
      # Список блоків, через які гравці не приховуватимуться.
      ignored_blocks:
        - "barrier"
        - "anvil"
        - "air"
        - "glass"
        - "pane"
        - "water"
        - "bubble_column"
        - "leaves"
        - "fence"
        - "trapdoor"
        - "door"
        - "lily_pad"
        - "web"
        - "ladder"
        - "iron_bars"
        - "bell"
        - "slime_block"
        - "honey_block"

      # Список світів, у яких робота цього модуля буде повністю вимкнена.
      disabled_worlds:
        - ""

    # Перемішує предмети в інвентарі під час руху, ламаючи роботу AutoTotem та InvWalk у читах.
    inventory: true
    # При відкритті контейнера на мить приховує всі предмети.
    # Ламає логіку ChestStealer, змушуючи чит думати, що він закриває порожню скриню.
    chest_loot: true

    # Спамить читу хибними пакетами вибухів тотемів.
    # Це дозволяє ламати сповіщення в читах про спрацьовування тотема.
    totem:

      # Чи потрібно ламати в читах TotemPopCounter?
      enabled: true
      # Режим роботи модуля:
      # 1. duplicate - відправляє повторні пакети вибуху на того ж гравця.
      # 2. bot - спавнить фейків під землею в момент вибуху.
      mode: duplicate
      # Кількість фейкових пакетів або ботів, що створюються за один вибух тотема.
      # Чим вище значення, тим сильніше заспамить екран читеру та зламає логіку детекту в софті.
      amount: 1
      # Чи потрібно спавнити фейкових ботів у таб-листі?
      # Якщо false, боти з'являтимуться лише у світі, не заважаючи легітним гравцям.
      # Чити бачитимуть вибухи тотемів, але боти не засмічуватимуть таб-лист.
      # Працює тільки якщо в mode встановлено BOT.
      spawn_tab: true
      # Вкажіть, на скільки блоків нижче гравця з'явиться фейковий бот із тотемом.
      # Працює тільки якщо в mode встановлено BOT.
      height: 15

    # Модуль створює фейкових модераторів у табі, щоб приховати справжніх модераторів від читів.
    # Не хвилюйтесь, ці боти існують лише на чіт-клієнті, реальні гравці їх не бачать.
    fake_staff:
      # Чи потрібно нам створювати фальшивих ботів для маскування реальної модерації
      enabled: true
      # Якщо true, Darkness завжди створює ботів з випадковими іменами.
      # Це допомагає сумісності з деякими серверами, але іноді дозволяє обійти StaffList.
      only_random_name: false
      # Вкажіть реальні префікси вашої модерації, які відображатимуться у фейкових ботів.
      roles:
        - "&cAdmin"
        - "&cStaff"
        - "&cHelper"
        - "&cModer"
      # Рекомендується встановити кількість ботів >= 60, щоб чіти не змогли відфільтрувати справжніх модераторів.
      bots: 60

    # Налаштування глядачів (потрібен дозвіл: darkness.spectator)
    spectators:
      # Приховувати глядачів тільки у цих світах. Залиште пустим, щоб дозволити всі світи.
      allowed_worlds:
        - ""
      # Приховати всіх глядачів з permission darkness.spectator, незалежно від активності.
      hide_spectators: true

# Compatibility Settings
compatibility:

  # Увімкніть, якщо у вас кросплатформений проєкт. Це виключить гравців Bedrock
  # із перевірок, допоможе уникнути хибних спрацювань.
  geyser: true

  # Увімкніть, якщо ви дозволяєте мод ItemsScroller. Це дозволить уникнути
  # хибних спрацювань при швидкому переміщенні предметів.
  itemsScroller: false

  # Увімкніть, якщо ви дозволяєте мод TapeMouse. Це запобіжить прапорцям
  # на афк фармилках, де удари йдуть в один і той самий таймінг.
  tapeMouse: false

  # Увімкніть, якщо ви дозволяєте макроси на клавіші. Це допоможе уникнути
  # хибних спрацювань при введенні команд під час ходьби.
  keybind: false

  # Чи потрібно враховувати кінематографічну камеру?
  # Наполегливо рекомендується не вмикати цю опцію, оскільки це зробить перевірки аіму менш ефективними.
  # У реальному бою жоден гравець не буде битися, використовуючи кінематографічну камеру.
  account_cinematic: false

# Увімкнути запис у журнал плагінів, які впроваджені в netty при підключенні для налагодження проблем сумісності
debug_pipeline_on_join: false

# Увімкнути експериментальні перевірки
experimental_checks: false

# Логер для перегляду пакетів, які надсилають гравці, корисно для розробників.
packet_logger:
  enabled: false

  # Вкажіть нижче гравців, чиї пакети будуть логуватися в консолі.
  whitelist:
    - 1hendex

  # Список пакетів, які потрібно ігнорувати.
  # Щоб дізнатися правильні імена, відкрийте GitHub PacketEvents і знайдіть назви.
  # Шлях: https://github.com/retrooper/packetevents/blob/2.0/api/src/main/java/com/github/retrooper/packetevents/protocol/packettype/PacketType.java
  ignore:
    - WINDOW_CONFIRMATION
    - KEEP_ALIVE
    - PLAYER_FLYING
    - PONG
    - CLIENT_TICK_END

# Назва сервера, яка буде відображатися в логах гравців та повідомленнях Discord
server_name: Darkness Server

# Вкажіть назву або назви для команд Даркнесс.
# Перша назва в списку стане основною командою плагіна.
# Зміни застосовуються лише після перезавантаження сервера.
command_name: darkness,dl

# Чи слід нам вимкнути дозвіл на обхід?
# Якщо ввімкнено, Даркнесс перевірятиме всіх гравців, включаючи операторів
# Вимкніть це для покращення продуктивності
disable_bypass_permission: false

proxy:
  # Увімкніть, якщо ваш сервер знаходиться в РФ і не може підключитися до системи ліцензування
  enabled: false

  # Налаштування проксі.
  # Типи: http, socks4, socks5
  protocol:
    type: socks5
    host: ""
    port: 0
    username: ""
    password: ""

config:
  checks_updates: true
  lang: uk
  version: 4
